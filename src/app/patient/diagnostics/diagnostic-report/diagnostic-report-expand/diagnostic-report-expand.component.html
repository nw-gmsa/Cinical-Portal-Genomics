<table style="width: 100%">
    <tr>
    <td style="width: 5%">&nbsp;</td>
    <td style="width: 95%">
        <mat-card>
            <mat-card-header>
                <mat-card-title>
                    <h4>Results</h4>
                </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <span *ngIf="observations !== undefined">
                  <app-observation [observations]="observations" [showFilter]="false"> </app-observation>
                </span>
            </mat-card-content>
        </mat-card>
    </td>
    </tr>
    <tr *ngIf="documentReference !== undefined">
        <td style="width: 5%">&nbsp;</td>
        <td style="width: 95%">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>
                        <h4>Documents</h4>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content>
                  <app-document-reference [documents]="documentReference" > </app-document-reference>
                </mat-card-content>
            </mat-card>
        </td>
    </tr>
</table>
